<style>
/* ---------- متغیرها و تم‌ها (رنگ‌ها رو از این‌جا دستکاری کن) ---------- */
@property --p{syntax:'<number>';inherits:false;initial-value:0} /* واسه انیمیشن نرمِ حلقه‌های مانیتور */
:root{--bg:#05060a;--glass:rgba(24,24,32,.62);--bd:rgba(255,255,255,.1);--mu:#a1a1aa;--ac:#3b82f6;--ac2:#8b5cf6;--mesh:.65;--r:20px;--mono:'JetBrains Mono',monospace;--ui:'Space Grotesk','Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;--hd:'Orbitron','Vazirmatn',sans-serif}
body.t-navy{--bg:#020617;--glass:rgba(15,23,42,.72);--bd:rgba(56,189,248,.2);--ac:#38bdf8;--ac2:#818cf8;--mesh:.3}
body.t-emerald{--bg:#021410;--glass:rgba(6,30,25,.7);--bd:rgba(16,185,129,.22);--ac:#10b981;--ac2:#34d399;--mesh:.3}
body.t-rose{--bg:#12060a;--glass:rgba(34,12,20,.7);--bd:rgba(244,63,94,.22);--ac:#f43f5e;--ac2:#fb923c;--mesh:.35}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:#fff;font-family:var(--ui);font-weight:500;display:grid;place-items:center;transition:background .6s;-webkit-user-select:none;user-select:none}
input,textarea,.tb{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

/* بک‌گراند مه‌آلود که همیشه تکون میخوره */
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;opacity:var(--mesh);transition:opacity .6s}
.b{position:absolute;border-radius:50%;filter:blur(90px);animation:fl 18s infinite alternate ease-in-out}
.b1{width:55vmax;height:55vmax;top:-15%;left:-15%;background:var(--ac2)}
.b2{width:60vmax;height:60vmax;bottom:-20%;right:-15%;background:var(--ac);animation-delay:-6s}
.b3{width:40vmax;height:40vmax;top:35%;left:50%;background:#0d9488;animation-delay:-12s}
@keyframes fl{to{transform:translate(18%,14%) scale(1.25)}}

/* قاب اصلی (تیلت سه‌بعدیش با JS انجام میشه) */
.app{width:min(92vw,430px);height:min(90dvh,840px);transition:transform .25s ease-out;will-change:transform}
.shell{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:38px;background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--bd);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);animation:up .9s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(40px) scale(.97)}}

/* نوار بالا: زبان، موزیک، تم، ترمینال */
.top{position:absolute;inset:calc(18px + env(safe-area-inset-top,0px)) 18px auto;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:20}
.ib{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:.25s}
.ib:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.ib:active{transform:scale(.9)}
#langBtn{font:700 11px var(--mono)}
.pill{flex:1;max-width:150px;height:38px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);font-size:11px;font-weight:600;transition:.3s}
.pill:active{transform:scale(.95)}
.pill.on{border-color:var(--ac);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 35%,transparent)}
#trk{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:flex;gap:2px;align-items:flex-end;height:13px}
.eq i{width:3px;height:3px;border-radius:2px;background:var(--ac)}
.pill.on .eq i{animation:eq .6s infinite alternate ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:13px}}

/* هدر: عکس، اسم، نقش‌ها */
.hero{padding:74px 20px 8px;text-align:center}
.av{position:relative;isolation:isolate;width:92px;height:92px;margin:0 auto 12px}
/* قاب عکس: شکل مایع که آروم تغییر میکنه + حلقه‌ی رنگی چرخان + دو تا جرقه‌ی مداری */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes morph{0%,100%{border-radius:42% 58% 60% 40%/46% 44% 56% 54%}33%{border-radius:58% 42% 46% 54%/40% 58% 42% 60%}66%{border-radius:48% 52% 38% 62%/58% 42% 60% 40%}}
@keyframes turn{to{--a:360deg}}
.av::before{content:'';position:absolute;inset:-7px;background:conic-gradient(from var(--a),var(--ac),var(--ac2),#f0abfc,var(--ac));animation:morph 8s ease-in-out infinite,turn 5s linear infinite}
.orb{position:absolute;inset:-12px;border-radius:50%;pointer-events:none;animation:spin 6s linear infinite}
.orb::before{content:'';position:absolute;top:0;left:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px var(--ac),0 0 20px var(--ac2)}
.o2{inset:-18px;animation-duration:9s;animation-direction:reverse}
.o2::before{width:5px;height:5px;background:var(--ac2);box-shadow:0 0 8px var(--ac2)}
.bdg{position:absolute;inset-inline-end:2px;bottom:4px;width:17px;height:17px;border-radius:50%;background:#22c55e;border:3px solid var(--bg);animation:pl 2s infinite}
.av::after{content:'';position:absolute;inset:-14px;border-radius:50%;background:var(--ac);filter:blur(24px);opacity:.35;z-index:-1;animation:gl 3s ease-in-out infinite alternate}
@keyframes gl{to{opacity:.6;transform:scale(1.12)}}
body.music .av::before{animation-duration:8s,2.2s}
body.music .orb{animation-duration:2.4s}body.music .o2{animation-duration:3.6s} /* موزیک که پخش بشه حلقه تندتر میچرخه 😎 */
@keyframes spin{to{transform:rotate(1turn)}}
.av img,.av b{position:relative;width:100%;height:100%;object-fit:cover;box-shadow:0 0 0 3px var(--bg);animation:morph 8s ease-in-out infinite;transition:transform .5s cubic-bezier(.34,1.4,.64,1)}
.av:hover img{transform:scale(1.05) rotate(-2deg)}
.av b{display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
h1{font-family:var(--hd);font-size:28px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#fff,var(--ac),var(--ac2),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.fa{font-size:15px;color:var(--mu);margin:1px 0 5px}
.role{height:18px;font-size:12px;font-weight:600;color:var(--ac);letter-spacing:.3px;margin-bottom:10px;transition:opacity .35s}
.live{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:11px;font-weight:500;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.09)}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%,100%{box-shadow:0 0 0 7px transparent}}
#time{padding-inline-start:8px;border-inline-start:1px solid rgba(255,255,255,.12);color:var(--mu);font-variant-numeric:tabular-nums}
.avail{margin:12px auto 0;max-width:290px;padding:8px 14px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:500;color:#86efac;background:linear-gradient(135deg,rgba(34,197,94,.12),color-mix(in srgb,var(--ac) 12%,transparent));border:1px solid rgba(34,197,94,.25)}

/* ناحیه‌ی اسکرول (بالا و پایینش محو میشه که پشت داک گم نشه) */
.scroll{flex:1;overflow-y:auto;padding:4px 20px 110px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 100px),transparent);mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 100px),transparent)}
.scroll::-webkit-scrollbar{display:none}
.tab{display:none}.tab.on{display:block}
.it{animation:rise .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

.sec{display:flex;align-items:center;gap:8px;margin:20px 4px 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--mu)}
.sec .ic{color:var(--ac);font-size:15px}
.box{position:relative;padding:16px;border-radius:var(--r);overflow:hidden;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);transition:transform .3s,border-color .3s}
.glow::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.11),transparent 60%)} /* نور دنبال موس/انگشت */
.glow:hover::after{opacity:1}
.glow:hover{border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
p{color:#d4d4d8;font-size:13px;line-height:1.7;margin-bottom:8px}p:last-child{margin:0}

.sk{margin-bottom:12px}.sk:last-child{margin:0}
.skh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px}
.skh em{font:700 11px var(--mono);color:var(--ac)}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% 100%;transition:width 1.3s cubic-bezier(.16,1,.3,1);animation:sl 3s linear infinite}
@keyframes sl{to{background-position:-200% 0}}

.list{display:flex;flex-direction:column;gap:12px}
.pc{border-inline-start:3px solid var(--ac)}
.pc:hover{transform:translateY(-3px)}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.chip{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:20px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pt{font-size:14px;font-weight:700}.ps{font:10px var(--mono);color:var(--mu);margin-top:2px}
.pd{font-size:12px;color:#a1a1aa;line-height:1.6;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10px;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07)}

.rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ra{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.rn{font-size:13px;font-weight:600}.rr{font-size:10px;color:var(--mu)}
.rs{color:#fbbf24;font-size:12px;letter-spacing:2px;margin-bottom:6px}
.rt{font-size:12px;color:#d4d4d8;line-height:1.6}
.rd{display:flex;gap:8px;align-items:center;margin-top:8px;font:10px var(--mono);color:#71717a}
.pend{padding:1px 7px;border-radius:6px;background:rgba(251,191,36,.15);color:#fbbf24}
.add{width:100%;margin-top:14px;padding:14px;border-radius:14px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ac);border:1px dashed color-mix(in srgb,var(--ac) 50%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent);transition:.2s}

.act{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;text-decoration:none;color:#fff;margin-bottom:10px;padding:12px 14px;border-radius:var(--r)}
.al{display:flex;align-items:center;gap:14px}
.at{font-size:13px;font-weight:600}.as{font:11px var(--mono);color:var(--mu);margin-top:2px}
.go{color:#52525b;transition:.3s}.act:hover .go{transform:translateX(4px);color:var(--ac)}
[dir=rtl] .go{transform:scaleX(-1)}[dir=rtl] .act:hover .go{transform:translateX(-4px) scaleX(-1)}
.ug{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.ut{padding:12px 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:600;color:#d4d4d8;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);transition:.2s}
.ut .ic{font-size:19px;color:var(--ac)}
.ut:hover{transform:translateY(-3px);border-color:var(--ac)}
.add:active,.ut:active,.act:active{transform:scale(.96)}

/* داک پایین با اون حبابی که سُر میخوره */
.dock{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;direction:ltr;display:flex;gap:6px;padding:7px;border-radius:30px;z-index:15;background:rgba(18,18,24,.75);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.dock .ind{position:absolute;top:7px;left:0;width:48px;height:48px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 50%,transparent);transition:transform .5s cubic-bezier(.34,1.4,.64,1)}
.dock button{position:relative;width:48px;height:48px;border-radius:20px;display:grid;place-items:center;font-size:21px;color:#8b8b97;transition:.3s}
.dock button.on{color:#fff;transform:translateY(-2px)}

/* صفحه‌های داخلی (مانیتور و ربات) */
.sub{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);transform:translateX(105%);transition:transform .5s cubic-bezier(.16,1,.3,1)}
[dir=rtl] .sub{transform:translateX(-105%)}
.sub.on{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 12px;background:rgba(0,0,0,.2);border-bottom:1px solid rgba(255,255,255,.06)}
.sh h3{font-size:15px;font-weight:600}.sh i{width:60px}
.bk{display:flex;align-items:center;gap:4px;padding:6px;font-size:13px;font-weight:600;color:var(--ac)}
[dir=rtl] .bk .ic{transform:scaleX(-1)}
.sc{flex:1;overflow-y:auto;padding:18px;scrollbar-width:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:16px;font-size:10px;letter-spacing:.5px;color:var(--mu);background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06)}
.ring{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--ac)) calc(var(--p)*1%),rgba(255,255,255,.07) 0);transition:--p .9s ease}
.ring b{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font:700 14px var(--mono);color:#fff}
.st{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:12px 14px;border-radius:12px;font-size:12px;background:rgba(0,0,0,.3)}
.st span{display:flex;align-items:center;gap:8px}.st b{font:11px var(--mono)}
.note{margin-top:14px;text-align:center;font-size:10px;color:#71717a}

.chat{height:min(430px,62dvh);display:flex;flex-direction:column;overflow:hidden;border-radius:18px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06)}
.ch{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.m{max-width:85%;padding:10px 13px;border-radius:16px;font-size:12.5px;line-height:1.55;animation:pop .35s cubic-bezier(.34,1.5,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}}
.mb{align-self:flex-start;background:rgba(255,255,255,.09);border-end-start-radius:4px}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));border-end-end-radius:4px}
.dt{display:flex;gap:4px;padding:13px 14px}
.dt i{width:6px;height:6px;border-radius:50%;background:#a1a1aa;animation:bn 1.2s infinite}
.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}
@keyframes bn{30%{transform:translateY(-5px)}}
.cin{display:flex;align-items:center;gap:6px;padding:8px;border-top:1px solid rgba(255,255,255,.06)}
.cin input{flex:1;min-width:0;padding:8px 10px;background:none;border:0;outline:0;color:#fff;font:16px var(--ui)}
.snd{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ac)}
.snd:active{transform:scale(.88)}

/* ترمینال هکری با خط‌های اسکن */
.term{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;border-radius:inherit;background:rgba(6,8,10,.97) repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);opacity:0;pointer-events:none;transform:scale(.94);transition:.45s cubic-bezier(.16,1,.3,1)}
.term.on{opacity:1;pointer-events:auto;transform:none}
.th{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.dots{display:flex;gap:8px}.dots i{width:13px;height:13px;border-radius:50%;cursor:pointer}
.d1{background:#ef4444}.d2{background:#f59e0b}.d3{background:#10b981}
.ex{padding:4px 12px;border-radius:8px;font:700 10px var(--mono);color:#ef4444;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35)}
.tb{flex:1;overflow-y:auto;padding:18px;font:13px/1.65 var(--mono);color:#22c55e;text-shadow:0 0 6px rgba(34,197,94,.45);scrollbar-width:none;direction:ltr;text-align:left}
.tl{white-space:pre-wrap;word-break:break-word}
.tp{display:flex;align-items:baseline}
.tp input{flex:1;min-width:80px;background:none;border:0;outline:0;color:inherit;font:16px var(--mono);text-shadow:inherit;caret-color:#22c55e}
